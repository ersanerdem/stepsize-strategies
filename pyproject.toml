[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepsize-strategies"
version = "0.1.0"
description = "Variable step size strategies for the Euler method: Picard, error analysis, and linear / non-linear systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ersan Erdem", email = "ersanerdem.ee@gmail.com" }]
keywords = [
    "ordinary differential equations", "ODE", "Euler method", "step size",
    "adaptive step", "numerical analysis", "Picard theorem", "error analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
plot = ["matplotlib>=3.7"]
all = ["pandas>=2.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://stepsizestrategies.pythonanywhere.com"
Repository = "https://github.com/ersanerdem/stepsize-strategies"
Issues = "https://github.com/ersanerdem/stepsize-strategies/issues"
"Web application" = "https://github.com/ersanerdem/step-size-strategy-webapp"
Article = "https://dergipark.org.tr/en/pub/konuralpjournalmath/article/618922"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stepsize_strategies = ["py.typed"]
